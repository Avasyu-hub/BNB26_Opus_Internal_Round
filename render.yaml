services:
  # 1. FastAPI Backend + Scikit-Learn Model (Port $PORT)
  - type: web
    name: relearn-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: relearn
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Vite React Frontend (Static Site on CDN)
  - type: web
    name: relearn-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: relearn/member-2-student-experience
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: relearn-backend
          type: web
          property: host
      - key: VITE_USE_MOCK
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
