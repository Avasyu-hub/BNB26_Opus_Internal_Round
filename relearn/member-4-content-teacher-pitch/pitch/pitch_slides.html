<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Re:Learn — Competition Pitch Presentation (2 Minutes)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between select-none overflow-hidden">

  <!-- Top Progress Bar & Header -->
  <div>
    <div class="h-1.5 w-full bg-slate-900">
      <div id="progressBar" class="h-full bg-gradient-to-r from-emerald-500 via-teal-400 to-emerald-400 transition-all duration-300" style="width: 12.5%;"></div>
    </div>
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between border-b border-slate-900/80">
      <div class="flex items-center gap-3">
        <span class="text-xl font-black tracking-tight text-white flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
          Re:<span class="text-emerald-400">Learn</span>
        </span>
        <span class="text-xs text-slate-500 font-mono">2-Min Live Pitch</span>
      </div>
      <div class="flex items-center gap-4 text-xs font-mono text-slate-400">
        <span>Slide <strong id="slideNum" class="text-white">1</strong> of 8</span>
        <span class="hidden sm:inline text-slate-600">|</span>
        <span id="slideTime" class="hidden sm:inline text-emerald-400">0:00 - 0:15</span>
      </div>
    </div>
  </div>

  <!-- Main Slide Viewport -->
  <main class="max-w-5xl mx-auto px-6 py-8 flex-1 flex items-center justify-center w-full">
    <div id="slideContent" class="w-full transition-all duration-300">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- Bottom Navigation & Controls -->
  <footer class="max-w-7xl mx-auto px-6 py-4 w-full flex items-center justify-between border-t border-slate-900/80 text-xs text-slate-500">
    <div class="flex items-center gap-2">
      <span class="px-2 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-400 font-mono">&larr;</span>
      <span class="px-2 py-0.5 rounded bg-slate-900 border border-slate-800 text-slate-400 font-mono">&rarr;</span>
      <span>to navigate</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="prevBtn" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold rounded-xl border border-slate-800 transition">
        &larr; Previous
      </button>
      <button id="nextBtn" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition">
        Next &rarr;
      </button>
    </div>
  </footer>

  <script>
    const SLIDES = [
      {
        num: 1,
        time: "0:00 - 0:15",
        tag: "The Core Hook",
        title: "The Fatal Illusion of 'Right Answers'",
        content: `
          <div class="space-y-6">
            <h2 class="text-3xl sm:text-5xl font-black text-white leading-tight">
              Fixing a wrong answer <br>is <span class="text-emerald-400 underline decoration-emerald-500/50">not</span> fixing the misconception.
            </h2>
            <p class="text-lg text-slate-300 max-w-3xl leading-relaxed">
              Every ed-tech app evaluates final answers. When a student fails, it reveals the textbook algorithm.
              The student mimics the mechanical step, passes an identical drill, and everyone celebrates.
            </p>
            <div class="p-6 bg-red-500/10 border border-red-500/30 rounded-2xl max-w-3xl">
              <div class="text-xs font-bold uppercase tracking-wider text-red-400 mb-1">The Latent Trap</div>
              <p class="text-sm text-red-200">
                The underlying algebraic misconception remains completely untouched—silently waiting to break down two years later in physics formulas, geometry proofs, and coding logic.
              </p>
            </div>
          </div>
        `
      },
      {
        num: 2,
        time: "0:15 - 0:30",
        tag: "The Classroom Reality",
        title: "The Step-Level Blindness in Secondary Math",
        content: `
          <div class="space-y-6">
            <div class="flex items-center gap-3">
              <span class="px-3 py-1 bg-slate-800 rounded-full text-xs font-bold text-slate-300 font-mono">CBSE / ICSE Grades 7-10</span>
              <span class="text-xs text-slate-500">40-60 Students per Class</span>
            </div>
            <h2 class="text-3xl sm:text-4xl font-extrabold text-white">
              Teachers cannot audit 3,000 mathematical lines every single day.
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-2">
              <div class="p-3 bg-slate-900 border border-slate-800 rounded-xl">
                <code class="text-xs text-orange-400 font-bold">2(x+3) &rarr; 2x+3</code>
                <div class="text-[11px] text-slate-400 mt-1">Partial Distribution</div>
              </div>
              <div class="p-3 bg-slate-900 border border-slate-800 rounded-xl">
                <code class="text-xs text-purple-400 font-bold">(a+b)² &rarr; a²+b²</code>
                <div class="text-[11px] text-slate-400 mt-1">Square of Sum</div>
              </div>
              <div class="p-3 bg-slate-900 border border-slate-800 rounded-xl">
                <code class="text-xs text-pink-400 font-bold">-(x+5) &rarr; -x+5</code>
                <div class="text-[11px] text-slate-400 mt-1">Negative Distribution</div>
              </div>
              <div class="p-3 bg-slate-900 border border-slate-800 rounded-xl">
                <code class="text-xs text-yellow-400 font-bold">x+5=10 &rarr; x=10+5</code>
                <div class="text-[11px] text-slate-400 mt-1">Transposition Error</div>
              </div>
              <div class="p-3 bg-slate-900 border border-slate-800 rounded-xl">
                <code class="text-xs text-cyan-400 font-bold">3x+5 &rarr; 8x</code>
                <div class="text-[11px] text-slate-400 mt-1">Unlike Terms</div>
              </div>
              <div class="p-3 bg-slate-900 border border-slate-800 rounded-xl">
                <code class="text-xs text-indigo-400 font-bold">(-3)(-4) &rarr; -12</code>
                <div class="text-[11px] text-slate-400 mt-1">Negative Times Negative</div>
              </div>
            </div>
          </div>
        `
      },
      {
        num: 3,
        time: "0:30 - 0:45",
        tag: "Technical Architecture",
        title: "Symbolic-First Determinism vs Unconstrained AI",
        content: `
          <div class="space-y-6">
            <h2 class="text-3xl sm:text-4xl font-extrabold text-white">
              Why we rejected pure LLM diagnosis.
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-5 bg-red-500/10 border border-red-500/30 rounded-2xl space-y-2">
                <h3 class="font-bold text-red-400 text-sm">Generic LLMs (GPT-4o / Claude)</h3>
                <ul class="text-xs text-slate-300 space-y-2 list-disc list-inside">
                  <li>2 to 4 second latency per line of math.</li>
                  <li>Hallucinates non-existent diagnostic categories.</li>
                  <li>Opaque probabilistic guesses rather than proofs.</li>
                  <li>High API costs exploding across classrooms.</li>
                </ul>
              </div>
              <div class="p-5 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl space-y-2">
                <h3 class="font-bold text-emerald-400 text-sm">Re:Learn Hybrid Engine</h3>
                <ul class="text-xs text-slate-300 space-y-2 list-disc list-inside">
                  <li><strong>SymPy Equivalence:</strong> Verified in &lt;150 ms locally.</li>
                  <li><strong>Deterministic Rules:</strong> 95% rule match confidence.</li>
                  <li><strong>Constrained Fallback:</strong> Strictly capped at &le; 0.70.</li>
                  <li><strong>Zero Biometric Capture:</strong> 100% COPPA/GDPR safe.</li>
                </ul>
              </div>
            </div>
          </div>
        `
      },
      {
        num: 4,
        time: "0:45 - 1:10",
        tag: "Live Demonstration",
        title: "Step 0 Error Localisation & Spatial Proof",
        content: `
          <div class="space-y-5">
            <div class="p-4 bg-slate-900 border border-slate-800 rounded-2xl font-mono text-sm space-y-1">
              <div class="text-slate-400 text-xs">Problem: Solve 2(x+3) = 14</div>
              <div class="text-red-400 font-bold bg-red-500/10 px-2 py-1 rounded border border-red-500/30">
                Line 1: 2x + 3 = 14  &larr; [ERROR PINPOINTED AT STEP 0]
              </div>
              <div class="text-slate-400 px-2 py-0.5">Line 2: 2x = 11</div>
              <div class="text-slate-400 px-2 py-0.5">Line 3: x = 5.5</div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 bg-orange-500/10 border border-orange-500/30 rounded-xl space-y-1">
                <div class="text-xs font-bold text-orange-400 uppercase">Diagnosis & Concept Graph</div>
                <div class="text-sm font-bold text-white">PARTIAL_DISTRIBUTION</div>
                <div class="text-xs text-slate-300">Root: Distributive Law &bull; Graph Node: Orange Glow</div>
              </div>
              <div class="p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-xl space-y-1">
                <div class="text-xs font-bold text-emerald-400 uppercase">Interactive Visual Proof (C4)</div>
                <div class="text-sm font-bold text-white">Rectangle Area Model</div>
                <div class="text-xs text-slate-300">Width 2, length split x & 3 &bull; Bilingual Hindi/Bengali</div>
              </div>
            </div>
          </div>
        `
      },
      {
        num: 5,
        time: "1:10 - 1:35",
        tag: "The Hero Breakthrough",
        title: "Cross-Domain Transfer Verification",
        content: `
          <div class="space-y-6">
            <div class="text-xs font-mono font-bold text-emerald-400 uppercase tracking-widest">
              The Moment Every Other App Misses
            </div>
            <h2 class="text-2xl sm:text-4xl font-black text-white leading-tight">
              Aced the algebra drill.<br>
              <span class="text-red-400">Failed the exact same concept in geometry.</span>
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl">
                <div class="text-xs text-slate-400 uppercase font-semibold">Immediate Same-Domain Retry</div>
                <div class="text-sm font-bold text-white mt-1">Solve 5(x-2) = 20</div>
                <div class="text-xs text-emerald-400 font-bold mt-2">Passed: x = 6 &check;</div>
                <div class="text-[11px] text-slate-500 mt-1">Standard platforms stop here.</div>
              </div>
              <div class="p-4 bg-red-500/10 border border-red-500/30 rounded-xl">
                <div class="text-xs text-red-400 uppercase font-semibold">Re:Learn Geometry Transfer Test</div>
                <div class="text-sm font-bold text-white mt-1">Garden width 2m, length (x+3)m. Total area?</div>
                <div class="text-xs text-red-300 font-bold mt-2">Student Answer: 2x + 3 m² &cross;</div>
                <div class="text-[11px] text-red-400 mt-1">Graph node gets pulsing RED RING: "Persists in new context".</div>
              </div>
            </div>
          </div>
        `
      },
      {
        num: 6,
        time: "1:35 - 1:45",
        tag: "Teacher Cockpit (W7)",
        title: "Automated Peer Remedial Grouping",
        content: `
          <div class="space-y-5">
            <div class="flex items-center justify-between">
              <h2 class="text-2xl sm:text-3xl font-extrabold text-white">Classroom Intelligence Across 40 Students</h2>
              <span class="text-xs font-mono px-3 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">
                Simulated Research Data (Class 8-B)
              </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl space-y-1">
                <div class="text-xs text-slate-400">T1 Heatmap</div>
                <div class="text-xl font-bold text-white">20% Square of Sum</div>
                <div class="text-[11px] text-slate-500">Highest error density</div>
              </div>
              <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl space-y-1">
                <div class="text-xs text-slate-400">T3 Dynamic Peer Groups</div>
                <div class="text-xl font-bold text-emerald-400">6 Remedial Labs</div>
                <div class="text-[11px] text-slate-500">Grouped by exact error step</div>
              </div>
              <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl space-y-1">
                <div class="text-xs text-slate-400">T4 Transfer Alerts</div>
                <div class="text-xl font-bold text-red-400">6 Persistent Alerts</div>
                <div class="text-[11px] text-slate-500">Aced algebra, failed transfer</div>
              </div>
            </div>
          </div>
        `
      },
      {
        num: 7,
        time: "1:45 - 1:55",
        tag: "Empirical Validation",
        title: "Accuracy Benchmark on 60 Real Student Traces",
        content: `
          <div class="space-y-6">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white">
              Harvested from CBSE & ICSE Exam Papers.
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl text-center">
                <div class="text-3xl font-black text-emerald-400">100%</div>
                <div class="text-xs text-slate-300 font-semibold mt-1">Step Localisation</div>
                <div class="text-[10px] text-slate-500">Goal: &ge; 90%</div>
              </div>
              <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl text-center">
                <div class="text-3xl font-black text-emerald-400">100%</div>
                <div class="text-xs text-slate-300 font-semibold mt-1">Classification</div>
                <div class="text-[10px] text-slate-500">Goal: &ge; 85%</div>
              </div>
              <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl text-center">
                <div class="text-3xl font-black text-white">0%</div>
                <div class="text-xs text-slate-300 font-semibold mt-1">Hallucination</div>
                <div class="text-[10px] text-slate-500">Strict Taxonomy Locked</div>
              </div>
              <div class="p-4 bg-slate-900 border border-slate-800 rounded-xl text-center">
                <div class="text-3xl font-black text-teal-400">92.3%</div>
                <div class="text-xs text-slate-300 font-semibold mt-1">Rule Coverage</div>
                <div class="text-[10px] text-slate-500">Local SymPy First</div>
              </div>
            </div>
          </div>
        `
      },
      {
        num: 8,
        time: "1:55 - 2:00",
        tag: "The Vision",
        title: "Mental Models That Outlive Algebra",
        content: `
          <div class="space-y-6 text-center max-w-2xl mx-auto">
            <h2 class="text-3xl sm:text-5xl font-black text-white leading-tight">
              Don't teach students to pass the next step.
            </h2>
            <p class="text-xl text-emerald-400 font-bold">
              Teach mental models that survive across science, geometry, and code.
            </p>
            <div class="pt-4 flex justify-center gap-3">
              <span class="px-3 py-1 rounded-full text-xs font-mono bg-slate-900 border border-slate-800 text-slate-400">
                42 Hand-Verified Items
              </span>
              <span class="px-3 py-1 rounded-full text-xs font-mono bg-slate-900 border border-slate-800 text-slate-400">
                6 Visual Proof SVGs
              </span>
              <span class="px-3 py-1 rounded-full text-xs font-mono bg-slate-900 border border-slate-800 text-slate-400">
                Local SQLite
              </span>
            </div>
            <div class="text-xs text-slate-500 pt-4">
              Re:Learn &bull; AI-Powered Diagnostic & Transfer Tutor
            </div>
          </div>
        `
      }
    ];

    let current = 0;

    function render() {
      const s = SLIDES[current];
      document.getElementById('slideNum').innerText = s.num;
      document.getElementById('slideTime').innerText = s.time;
      document.getElementById('progressBar').style.width = `${((current + 1) / SLIDES.length) * 100}%`;

      document.getElementById('slideContent').innerHTML = `
        <div class="space-y-4">
          <div class="inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono">
            ${s.tag}
          </div>
          ${s.content}
        </div>
      `;

      document.getElementById('prevBtn').disabled = current === 0;
      document.getElementById('prevBtn').style.opacity = current === 0 ? '0.4' : '1';
      document.getElementById('nextBtn').innerText = current === SLIDES.length - 1 ? 'Finish' : 'Next →';
    }

    document.getElementById('prevBtn').onclick = () => {
      if (current > 0) { current--; render(); }
    };
    document.getElementById('nextBtn').onclick = () => {
      if (current < SLIDES.length - 1) { current++; render(); }
    };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        if (current < SLIDES.length - 1) { current++; render(); }
      } else if (e.key === 'ArrowLeft') {
        if (current > 0) { current--; render(); }
      }
    });

    render();
  </script>
</body>
</html>
