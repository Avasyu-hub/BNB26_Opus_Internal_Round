                          ))}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: TRANSFER ALERTS */}
            {tab === 'alerts' && (
              <div className="space-y-5">
                <div className="bg-gradient-to-r from-red-500/10 via-red-500/15 to-red-500/10 border border-red-500/30 rounded-3xl p-6 text-red-200 shadow-xl">
                  <div className="flex items-center gap-3">
                    <span className="w-3 h-3 rounded-full bg-red-400 animate-ping"></span>
                    <h2 className="text-lg font-extrabold text-red-300 tracking-wide">
                      T4: The Hero Feature &bull; Cross-Domain Transfer Failure Alerts
                    </h2>
                  </div>
                  <p className="text-xs text-red-300/80 mt-2 leading-relaxed max-w-4xl">
                    Every traditional platform assumes that because a student aced the mechanical algebra drill, the concept is learned.
                    Re:Learn rigorously tests whether the repaired mental model survives in physics, geometry, and code.
                    The 6 students below passed the algebraic drill, but failed the isomorphic transfer question.
                  </p>
                </div>

                <div className="space-y-4">
                  {SEEDED_DATA.transfer_failure_alerts.map((alert, idx) => (
                    <div
                      key={idx}
                      className="p-5 bg-slate-900 border border-slate-800 hover:border-red-500/40 rounded-2xl transition flex flex-col md:flex-row md:items-center justify-between gap-4 shadow"
                    >
                      <div className="space-y-2">
                        <div className="flex items-center gap-3">
                          <span className="text-lg font-bold text-white">{alert.student_name}</span>
                          <span className="text-xs text-slate-400 font-mono px-2 py-0.5 bg-slate-800 rounded">{alert.student_id}</span>
                          <span className="px-2.5 py-0.5 rounded text-[11px] font-bold uppercase bg-red-500/20 text-red-300 border border-red-500/40">
                            {alert.transfer_domain} Transfer Failure
                          </span>
                        </div>
                        <div className="text-xs text-slate-300">
                          Root Misconception: <strong className="text-orange-400">{alert.misconception}</strong> &bull; Initial Equation: <code className="text-slate-300">{alert.formula}</code>
                        </div>
                        <p className="text-xs text-slate-400 max-w-4xl bg-slate-950 p-3 rounded-xl border border-slate-800/80">
                          <strong className="text-slate-300">Diagnostic Clinical Trace:</strong> {alert.notes}
                        </p>
                      </div>

                      <div className="flex items-center gap-2 self-end md:self-center">
                        <button
                          onClick={() => setModalStudent(alert)}
                          className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 rounded-xl transition"
                        >
                          Deep Dive
                        </button>
                        <button
                          onClick={() => alert(`Domain bridging module sent to ${alert.student_name}`)}
                          className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white rounded-xl shadow transition"
                        >
                          Bridge Domain
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: ROSTER */}
            {tab === 'roster' && (
              <div className="space-y-5">
                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                  <input
                    type="text"
                    placeholder="Search student by name or ID (e.g. Rohan, s_07)..."
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    className="w-full sm:w-80 px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500"
                  />
                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <span className="text-xs text-slate-400 font-semibold">Cohort Filter:</span>
                    <select
                      value={filter}
                      onChange={e => setFilter(e.target.value)}
                      className="px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500"
                    >
                      <option value="all">All 40 Students</option>
                      <option value="active">Active Misconceptions (8)</option>
                      <option value="transfer_failed">Transfer Failures (6)</option>
                      <option value="mastered">Mastered / Cleared (26)</option>
                    </select>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-950 text-slate-400 border-b border-slate-800 font-semibold">
                      <tr>
                        <th className="py-3.5 px-4">Student ID</th>
                        <th className="py-3.5 px-4">Student Name</th>
                        <th className="py-3.5 px-4">Status</th>
                        <th className="py-3.5 px-4">Active Misconception</th>
                        <th className="py-3.5 px-4">Transfer Domain</th>
                        <th className="py-3.5 px-4 text-center">Telemetry Conf.</th>
                        <th className="py-3.5 px-4 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/80">
                      {filtered.map(s => (
                        <tr key={s.id} className="hover:bg-slate-800/40 transition">
                          <td className="py-3 px-4 font-mono font-bold text-slate-300">{s.id}</td>
                          <td className="py-3 px-4 font-bold text-white">{s.name}</td>
                          <td className="py-3 px-4">
                            <span className={`px-2 py-0.5 rounded text-[11px] font-bold uppercase ${
                              s.status === 'mastered'
                                ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                                : s.status === 'transfer_failed'
                                ? 'bg-red-500/20 text-red-300 border border-red-500/30'
                                : 'bg-orange-500/20 text-orange-300 border border-orange-500/30'
                            }`}>
                              {s.status.replace('_', ' ')}
                            </span>
                          </td>
                          <td className="py-3 px-4">
                            {s.misc ? (
                              <span className="text-orange-300 font-medium">{s.misc}</span>
                            ) : (
                              <span className="text-slate-500">&mdash; Clear &mdash;</span>
                            )}
                          </td>
                          <td className="py-3 px-4 capitalize text-slate-400">{s.domain || 'N/A'}</td>
                          <td className="py-3 px-4 text-center">
                            <span className={`font-mono text-[10px] uppercase font-bold px-2 py-0.5 rounded ${
                              s.conf === 'high' ? 'text-emerald-400 bg-emerald-500/10' :
                              s.conf === 'medium' ? 'text-amber-400 bg-amber-500/10' :
                              'text-red-400 bg-red-500/10'
                            }`}>
                              {s.conf}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-right">
                            <button
                              onClick={() => setModalStudent(s)}
                              className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-semibold transition"
                            >
                              Inspect
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* Modal */}
            {modalStudent && (
              <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <div>
                      <h3 className="text-xl font-bold text-white">{modalStudent.student_name || modalStudent.name}</h3>
                      <span className="text-xs text-slate-400 font-mono">{modalStudent.student_id || modalStudent.id} &bull; Class 8-B</span>
                    </div>
                    <button
                      onClick={() => setModalStudent(null)}
                      className="text-slate-400 hover:text-white text-2xl font-bold"
                    >
                      &times;
                    </button>
                  </div>

                  <div className="space-y-3 text-xs">
                    <div>
                      <span className="text-slate-400 font-semibold block mb-1">Diagnostic Profile:</span>
                      <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-slate-200 font-medium">
                        {modalStudent.misconception || modalStudent.misc ? (
                          <span className="text-orange-400 font-bold">{modalStudent.misconception || modalStudent.misc}</span>
                        ) : (
                          <span className="text-emerald-400 font-bold">Concept Mastered &bull; Zero Active Misconceptions</span>
                        )}
                      </div>
                    </div>

                    <div>
                      <span className="text-slate-400 font-semibold block mb-1">Clinical Observation Notes:</span>
                      <p className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-slate-300 leading-relaxed">
                        {modalStudent.notes || "Demonstrates strong retention of symbolic equivalence. Successfully completed cross-domain transfer scenario."}
                      </p>
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3">
                    <button
                      onClick={() => setModalStudent(null)}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-bold"
                    >
                      Close
                    </button>
                    <button
                      onClick={() => {
                        alert("Remedial visual proof assignment dispatched!");
                        setModalStudent(null);
                      }}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow"
                    >
                      Dispatch Intervention
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
